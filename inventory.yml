all:
  vars:
    ansible_user: workstation
    server_group: "{{ inventory_hostname }}"
    ansible_port: 22

  children:
    laptops:
      hosts:
        p1:
          ansible_host: p1.modi.local
        mbp:
          ansible_host: mbp.modi.local
    desktops:
      hosts:
        beefy:
          ansible_host: beefy.modi.local
        studio:
          ansible_host: studio.modi.local
    vms:
      hosts:
        gui:
          ansible_host: gui.modi.local
        ai:
          ansible_host: ai.modi.local
    nas:
      hosts:
        nas:
          ansible_host: nas.modi.local

    servers:
      hosts:
        virt:
          ansible_host: virt.modi.local
        remote:
          ansible_host: remote.modi.local
